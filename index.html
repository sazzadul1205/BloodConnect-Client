<!doctype html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/blood.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blood Connect - A platform connecting blood donors with patients in need. Save lives through community support and real-time blood donation requests."
    />
    <meta
      name="keywords"
      content="blood donation, donor, blood bank, emergency blood, save lives, SCO"
    />
    <meta name="author" content="Sazzadul Islam" />

    <!-- SCO Information -->
    <meta
      name="sco-organization"
      content="Standing Conference of Organizations (SCO)"
    />
    <meta
      name="sco-purpose"
      content="Blood Donation Awareness and Emergency Response"
    />
    <meta name="sco-registration" content="SCO/BLOOD/2024/001" />

    <title>Blood Connect | SCO Blood Donation Initiative</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta
      property="og:title"
      content="Blood Connect - SCO Blood Donation Initiative"
    />
    <meta
      property="og:description"
      content="Join the SCO blood donation campaign. Save lives by donating blood or requesting emergency blood supplies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/blood-og-image.jpg" />

    <!-- Favicon for different platforms -->
    <link rel="apple-touch-icon" sizes="180x180" href="/blood.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-32x32.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- SCO Badge (optional - adds a small visual indicator) -->
    <div
      style="display: none"
      id="sco-badge"
      data-organization="SCO"
      data-initiative="Blood Donation"
    ></div>
  </body>
</html>
